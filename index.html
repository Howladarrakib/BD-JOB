<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD JOB - Login</title>
<style>
  *{box-sizing:border-box;font-family:sans-serif}
  body{margin:0;background:#0a1a4a;display:flex;justify-content:center;min-height:100vh;color:white}
  .box{width:100%;max-width:420px;padding:20px}
  .tabs{display:flex;background:#0f204f;border-radius:15px;padding:5px;margin-bottom:20px}
  .tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:transparent;color:#aaa}
  .tabs button.active{background:linear-gradient(90deg,#2196f3,#9c27b0);color:white}
  input{width:100%;padding:14px;border:none;border-radius:12px;background:#0a1a3a;color:white;margin:8px 0 15px;outline:none;font-size:16px}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#2196f3,#9c27b0);color:white;font-weight:bold;font-size:17px;cursor:pointer}
  .btn:disabled{opacity:.6}
  label{font-size:15px;color:#ddd}
  #msg{text-align:center;margin-top:12px;font-size:14px;color:#ffcc80;min-height:20px}
</style>
</head>
<body>
<div class="box">
  <p style="text-align:center;opacity:.8">Your Career, Your Future</p>
  <div class="tabs">
    <button id="tabReg" class="active" onclick="showTab('reg')">Register</button>
    <button id="tabLog" onclick="showTab('login')">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="regBox">
    <h2>Create Account</h2>
    <p style="opacity:.7">Create your BD JOB account.</p>
    <label>Full Name</label>
    <input id="regName" placeholder="Rakib" type="text">
    <label>Mobile Number</label>
    <input id="regMobile" placeholder="018XXXXXXXXX" type="tel">
    <label>Password</label>
    <input id="regPass" placeholder="••••••" type="password">
    <label>Confirm Password</label>
    <input id="regConfirm" placeholder="••••••" type="password">
    <button class="btn" id="regBtn" onclick="registerUser()">CREATE ACCOUNT →</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" style="display:none">
    <h2>Welcome Back</h2>
    <p style="opacity:.7">Login to your BD JOB account.</p>
    <label>Mobile Number</label>
    <input id="loginMobile" placeholder="018XXXXXXXXX" type="tel">
    <label>Password</label>
    <input id="loginPass" placeholder="••••••" type="password">
    <button class="btn" id="loginBtn" onclick="loginUser()">LOGIN →</button>
  </div>

  <p id="msg"></p>
  <p style="text-align:center;opacity:.6;font-size:13px">© 2026 BD JOB | All Rights Reserved</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // তোমার Firebase Config - স্ক্রিনশট থেকে নেওয়া
  const firebaseConfig = { 
  apiKey: "AIzaSyArqUadtFApeblIJGaU5aPHASkcvrKNTJc", 
  authDomain: "bd-job-85768.firebaseapp.com", 
  projectId: "bd-job-85768", 
  storageBucket: "bd-job-85768.firebasestorage.app", 
  messagingSenderId: "1028353082550", 
  appId: "1:1028353082550:web:827629bf347e2e409cd217" 
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const msg = document.getElementById('msg');
  function showMsg(t){ msg.innerText = t; }

  window.showTab = function(type){
    document.getElementById('regBox').style.display = type==='reg' ? 'block' : 'none';
    document.getElementById('loginBox').style.display = type==='login' ? 'block' : 'none';
    document.getElementById('tabReg').classList.toggle('active', type==='reg');
    document.getElementById('tabLog').classList.toggle('active', type==='login');
    showMsg('');
  }

  // REGISTER
  window.registerUser = async function(){
    const name = document.getElementById('regName').value.trim();
    const mobile = document.getElementById('regMobile').value.trim();
    const pass = document.getElementById('regPass').value;
    const confirm = document.getElementById('regConfirm').value;

    if(!name || !mobile || !pass) return showMsg('সব ঘর পূরণ করো!');
    if(mobile.length !== 11) return showMsg('সঠিক ১১ সংখ্যার মোবাইল নম্বর দাও!');
    if(pass !== confirm) return showMsg('পাসওয়ার্ড মিলছে না!');
    if(pass.length < 6) return showMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!');

    const fakeEmail = mobile + "@bdjob.com";
    document.getElementById('regBtn').disabled = true;
    showMsg('অ্যাকাউন্ট তৈরি হচ্ছে...');

    try{
      const userCred = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
      await updateProfile(userCred.user, { displayName: name });
      // Firestore এ নাম + মোবাইল সেভ করা
      await setDoc(doc(db, "users", userCred.user.uid), {
        name: name,
        mobile: mobile,
        createdAt: new Date().toISOString()
      });
      showMsg('✅ অ্যাকাউন্ট তৈরি হয়ে গেছে! এখন লগইন করো।');
      setTimeout(()=> showTab('login'), 1000);
    }catch(e){
      if(e.code === 'auth/email-already-in-use') showMsg('এই নম্বর দিয়ে আগেই অ্যাকাউন্ট খোলা আছে, লগইন করো।');
      else showMsg('Error: ' + e.message);
    }
    document.getElementById('regBtn').disabled = false;
  }

  // LOGIN
  window.loginUser = async function(){
    const mobile = document.getElementById('loginMobile').value.trim();
    const pass = document.getElementById('loginPass').value;
    if(!mobile || !pass) return showMsg('মোবাইল ও পাসওয়ার্ড দাও!');

    const fakeEmail = mobile + "@bdjob.com";
    showMsg('লগইন হচ্ছে...');
    try{
      await signInWithEmailAndPassword(auth, fakeEmail, pass);
      showMsg('✅ লগইন সফল! স্বাগতম।');
      showMsg('✅ লগইন সফল! Dashboard এ যাচ্ছে...');
setTimeout(() => {
  window.location.href = "./dashboard.html";
}, 800);
    }catch(e){
      showMsg('লগইন হয়নি! নম্বর বা পাসওয়ার্ড ভুল।');
    }
  }
</script>
</body>
</html>
